# 縄張り台を Cloudflare Workers に置く設定。アプリ（app/）の配信と、同期の保管庫（/api/）を一つの Worker で受ける。
# 置き方は docs/sync.md。
name = "nawabari"
main = "server/worker.js"
compatibility_date = "2026-06-01"

# アプリのファイル（app/）も保管庫に入れて Worker から返す（tools/upload-app.mjs）。
# Workers の静的アセットは、配置の時に使い捨ての鍵を使うため、トークンを中継で差し込む環境からは上げられない。

# 保管庫（KV）。id は「npx wrangler kv namespace create STORE」で出た値に置き換える。
[[kv_namespaces]]
binding = "STORE"
id = "782953ddf49746948b520ec1de500332"
